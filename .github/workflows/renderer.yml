name: Renderer CI

on:
  push:
    branches: [main]
    paths:
      - "renderer/**"
      - ".github/workflows/renderer.yml"
  pull_request:
    branches: [main]
    paths:
      - "renderer/**"
      - ".github/workflows/renderer.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: renderer/package.json
      - run: npm install
      - run: npm run typecheck
