[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jack-pockets-pro-max"
version = "0.2.0"
description = "AI-assisted documentary video generation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]
media = [
  "edge-tts>=7,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jackpockets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["jackpockets"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_documentary.py" = ["I001"]
